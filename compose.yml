  postgres:
    container_name: postgres
    image: postgres:18.1-alpine3.23
    restart: always
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - ./postgres_data:/var/lib/postgresql

    env_file:
      - .env
    networks:
      - app-net
    ports:
      - '127.0.0.1:5432:5432'
    # expose:
    #   - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # redis_volume:
  postgres_data:
  docker-entrypoint.sh:

networks:
  app-net:
    name: app-net
    driver: bridge
