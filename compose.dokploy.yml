# One compose file for every dokploy deployment (staging, production). The
# deployment-specific values come from the dokploy env, never from here:
#   DEPLOY_NAME           project + Traefik router prefix, e.g. poppynz-staging.
#                         Must be unique per dokploy host or routers collide.
#   APP_HOST              public host of web + api, e.g. app.staging.poppynz.com
#   DRIZZLE_GATEWAY_HOST  public host of drizzle-gate, e.g. db.staging.poppynz.com
#   ENVIRONMENT           dev | staging | production; gates outbound mail
#                         (@repo/mail) and defaults to "dev" when unset, which
#                         only mails @poppynz.com addresses and the admin accounts
#   ORIGIN, TRUSTED_ORIGINS, BETTER_AUTH_URL
#                         https://$APP_HOST — adapter-node CSRF / absolute URLs
#                         and better-auth magic-link callback origins
# The `:?` interpolation makes a missing host fail the deploy instead of
# silently routing nothing.
name: ${DEPLOY_NAME:?DEPLOY_NAME is required}

x-app-env: &app-env
  NODE_ENV: production

services:
  migrations:
    build:
      context: .
      dockerfile: ./Dockerfile.migrations.production
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
    networks:
      - dokploy-network

  seeds:
    build:
      context: .
      dockerfile: ./Dockerfile.seeds.production
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
    networks:
      - dokploy-network
    depends_on:
      migrations:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    expose:
      - "3000"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      # More specific rule than the web router, so /api/* wins by priority.
      - traefik.http.routers.${DEPLOY_NAME}-api.rule=Host(`${APP_HOST:?APP_HOST is required}`) && (PathPrefix(`/api`) || PathPrefix(`/webhooks`))
      - traefik.http.routers.${DEPLOY_NAME}-api.entrypoints=websecure
      - traefik.http.routers.${DEPLOY_NAME}-api.tls.certresolver=letsencrypt
      - traefik.http.services.${DEPLOY_NAME}-api.loadbalancer.server.port=3000
    depends_on:
      migrations:
        condition: service_completed_successfully
      seeds:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      WORKER_HTTP_PORT: 3000
    expose:
      - "3000"
    networks:
      - dokploy-network
    depends_on:
      migrations:
        condition: service_completed_successfully
      seeds:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.${DEPLOY_NAME}-web.rule=Host(`${APP_HOST:?APP_HOST is required}`)
      - traefik.http.routers.${DEPLOY_NAME}-web.entrypoints=websecure
      - traefik.http.routers.${DEPLOY_NAME}-web.tls.certresolver=letsencrypt
      - traefik.http.services.${DEPLOY_NAME}-web.loadbalancer.server.port=3000
    depends_on:
      api:
        condition: service_healthy

  drizzle-gate:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: always
    env_file:
      - .env
    environment:
      PORT: 3000
      STORE_PATH: ${DRIZZLE_GATEWAY_STORE_PATH}
      MASTERPASS: ${DRIZZLE_GATEWAY_MASTERPASS}
    networks:
      - dokploy-network
    expose:
      - "3000"
    volumes:
      - drizzle-gateway:${DRIZZLE_GATEWAY_STORE_PATH}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${DEPLOY_NAME}-db.rule=Host(`${DRIZZLE_GATEWAY_HOST:?DRIZZLE_GATEWAY_HOST is required}`)
      - traefik.http.routers.${DEPLOY_NAME}-db.entrypoints=websecure
      - traefik.http.routers.${DEPLOY_NAME}-db.tls.certresolver=letsencrypt
      - traefik.http.services.${DEPLOY_NAME}-db.loadbalancer.server.port=3000

volumes:
  drizzle-gateway:

networks:
  dokploy-network:
    external: true
