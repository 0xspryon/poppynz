name: 'poppynz_dev'
services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    restart: unless-stopped
    working_dir: /usr/src/app
    command: sh -c "bun install --frozen-lockfile && bun --cwd /usr/src/app/apps/api dev"
    env_file: "./apps/api/src/.env"
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      TYPESENSE_HOST: typesense
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/usr/src/app
      - bun_node_modules:/usr/src/app/node_modules
    networks:
      - app-net
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  worker:
    container_name: worker
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    restart: unless-stopped
    working_dir: /usr/src/app
    command: sh -c "bun install --frozen-lockfile && bun --cwd /usr/src/app/apps/worker dev"
    env_file: "./apps/api/src/.env"
    environment:
      TYPESENSE_HOST: typesense
      REDIS_URL: redis://redis:6379
      WORKER_HTTP_PORT: 3001
    volumes:
      - .:/usr/src/app
      - bun_node_modules:/usr/src/app/node_modules
    networks:
      - app-net
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  migrations:
    container_name: migrations
    build:
      context: .
      dockerfile: ./Dockerfile.migrations.dev
    restart: 'no'
    working_dir: /usr/src/app
    env_file: "./apps/api/src/.env"
    # environment:
    #   - DATABASE_URL=postgres://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}
    volumes:
      - .:/usr/src/app
      - bun_node_modules:/usr/src/app/node_modules
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:18.1-alpine3.23
    restart: always
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - ./postgres_data:/var/lib/postgresql
    networks:
      - app-net
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs-permissions:
    container_name: rustfs-permissions
    image: alpine:3.22
    command: >
      sh -c "
        chown -R 10001:10001 /data0 /data1 /data2 /data3 /logs &&
        echo 'RustFS volume permissions fixed'
      "
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3
      - rustfs_logs:/logs
    networks:
      - app-net
    restart: 'no'

  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
      - RUSTFS_VOLUMES=/data/rustfs{0...3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_OBS_LOGGER_LEVEL=${RUSTFS_OBS_LOGGER_LEVEL:-info}
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
      - rustfs_logs:/app/logs
    networks:
      - app-net
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    container_name: redis
    image: redis:7.4-alpine
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    container_name: typesense
    image: typesense/typesense:28.0
    restart: unless-stopped
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:-typesense-dev-key} --enable-cors'
    volumes:
      - typesense_data:/data
    networks:
      - app-net
    ports:
      - '127.0.0.1:8108:8108'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8108/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # redis_volume:
  bun_node_modules:
  postgres_data:
  docker-entrypoint.sh:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
  rustfs_logs:
  typesense_data:

networks:
  app-net:
    name: app-net
    driver: bridge
