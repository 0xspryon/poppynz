  # queuedash:
  #   container_name: queuedash
  #   build:
  #     context: .
  #     dockerfile: ./apps/queuedash_config_generator/Dockerfile.prod
  #     args:
  #       - QUEUE_REDIS_URI=redis://redis:6379/5
  #   env_file:
